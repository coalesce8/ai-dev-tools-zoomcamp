[project]
name = "waitlist"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "R", email = "313034760+coalesce8@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008", # Depends(...) in argument defaults is the idiomatic FastAPI pattern.
]
