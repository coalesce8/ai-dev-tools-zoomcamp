name: hw3 CI

on:
  push:
    branches: [main]
    paths: ["hw3/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["hw3/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: hw3

env:
  RELAY_DATABASE_URL: postgresql+psycopg://agent_relay:agent_relay@localhost:5432/agent_relay

jobs:
  test:
    name: Test (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agent_relay
          POSTGRES_USER: agent_relay
          POSTGRES_PASSWORD: agent_relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_relay -d agent_relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: hw3/uv.lock

      - run: uv python install

      - run: uv sync --frozen

      # Covers both the starter protocol tests (test_agent_relay.py) and the
      # real-HTTP integration test (test_integration_relay_flow.py) against
      # the PostgreSQL service above.
      - run: uv run pytest -q

  build-and-deploy:
    name: Build image and deploy to kind
    runs-on: ubuntu-latest
    needs: test
    env:
      KIND_CLUSTER: agent-relay
    steps:
      - uses: actions/checkout@v4

      # This job deploys to the developer's own long-lived local kind
      # cluster (created out-of-band, e.g. `kind create cluster --name
      # agent-relay`) rather than provisioning a throwaway one, so it needs
      # the host's Docker daemon (to talk to the cluster's node containers)
      # and the kind/kubectl CLIs. On a GitHub-hosted runner there is no
      # such cluster; this job is meant for a self-hosted runner or a local
      # `act` run on the machine that has it.
      - name: Install kubectl and kind
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -Lo "$HOME/.local/bin/kubectl" "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x "$HOME/.local/bin/kubectl"
          curl -Lo "$HOME/.local/bin/kind" https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          chmod +x "$HOME/.local/bin/kind"

      - name: Point kubectl at the existing kind cluster
        run: |
          kind get kubeconfig --name "$KIND_CLUSTER" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      # A fresh tag per run (rather than reusing e.g. `agent-relay:local`)
      # is what makes the rollout below meaningful: kubelet only restarts
      # pods when the image reference actually changes, and with
      # `imagePullPolicy: Never` a repeated tag would silently keep running
      # old container content even after `kind load` replaces it.
      # A timestamp (rather than github.sha/run_id) stays unique across
      # repeated runs against uncommitted changes too, e.g. local `act`
      # iterations where the commit and act's synthetic run_id don't change.
      - name: Set unique image tag
        id: image
        run: echo "tag=${{ github.sha }}-$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build -t "agent-relay:${{ steps.image.outputs.tag }}" .

      - name: Load image into kind
        run: kind load docker-image "agent-relay:${{ steps.image.outputs.tag }}" --name "$KIND_CLUSTER"

      - name: Deploy manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/
          kubectl -n agent-relay set image deployment/agent-relay "agent-relay=agent-relay:${{ steps.image.outputs.tag }}"

      - name: Wait for rollout
        run: |
          kubectl -n agent-relay rollout status deployment/postgres --timeout=120s
          kubectl -n agent-relay rollout status deployment/agent-relay --timeout=180s
